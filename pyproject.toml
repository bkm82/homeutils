[project]
name = "homeutils"
version = "0.2.0"
description = "Personal homelab utility apps (networth tracker, medicine reminder, etc.) built on Django + htmx."
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.2",
    "django-htmx>=1.29.0",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.ruff]
line-length = 99
target-version = "py313"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]

[tool.ty.environment]
python = ".venv"

[tool.ty.src]
exclude = ["**/migrations/**"]

[tool.ty.rules]
# ty has no django-stubs equivalent, so it can't see that Model field
# descriptors resolve to plain values, that `objects`/reverse FK managers
# exist, or that request.user/.htmx are added by middleware. Without this,
# every ordinary Django model/request access is a false positive. The same
# gap also shows up as unsupported-operator, e.g. max()/arithmetic mixing a
# raw field descriptor type into a union with the real value type.
unresolved-attribute = "ignore"
invalid-return-type = "ignore"
unsupported-operator = "ignore"
