<div class="med-card{% if taken_today %} taken-today{% endif %}" id="med-{{ medication.id }}">
    <div class="med-card-top">
        <div>
            <div class="med-name">{{ medication.name }}</div>
            {% if medication.note %}<div class="med-note">{{ medication.note }}</div>{% endif %}
        </div>
        <form method="post" action="{% url 'meds:archive' medication.id %}">
            {% csrf_token %}
            <button class="btn-ghost" type="submit" aria-label="Archive {{ medication.name }}">&times;</button>
        </form>
    </div>

    <div class="stat-row">
        <div class="streak{% if streak == 0 %} zero{% endif %}">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 2c1 3-3 4-3 8a3 3 0 006 0c0-1-1-2-1-3 2 1 4 4 4 7a6 6 0 11-12 0c0-5 3-7 6-12z" />
            </svg>
            <span>{{ streak }}</span>
        </div>
        <svg class="ring" viewBox="0 0 48 48" aria-hidden="true">
            <circle class="ring-track" cx="24" cy="24" r="18"></circle>
            <circle class="ring-value" cx="24" cy="24" r="18" stroke-dasharray="{% widthratio completion 100 113 %} 113"></circle>
            <text class="ring-text" x="24" y="25">{{ completion }}</text>
        </svg>
    </div>

    <div class="heatmap">
        {% for cell in heatmap %}
        <span class="heatmap-cell {{ cell.status }}" title="{{ cell.date|date:'M j' }}"></span>
        {% endfor %}
    </div>

    <div class="card-footer">
        <button type="button" class="take-toggle{% if taken_today %} taken{% endif %}"
                hx-post="{% url 'meds:toggle' medication.id %}"
                hx-target="closest .med-card"
                hx-swap="outerHTML"
                aria-label="Toggle today's dose for {{ medication.name }}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                <polyline points="4 12 9 17 20 6" />
            </svg>
        </button>

        <form class="backfill-form"
              method="post"
              action="{% url 'meds:toggle' medication.id %}"
              hx-post="{% url 'meds:toggle' medication.id %}"
              hx-target="closest .med-card"
              hx-swap="outerHTML">
            {% csrf_token %}
            <input type="date"
                   name="date"
                   min="{{ medication.created_at|date:'Y-m-d' }}"
                   max="{{ today|date:'Y-m-d' }}"
                   required
                   aria-label="Log a different day for {{ medication.name }}">
            <button class="btn-ghost" type="submit" aria-label="Toggle the selected day for {{ medication.name }}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <polyline points="4 12 9 17 20 6" />
                </svg>
            </button>
        </form>
    </div>
</div>
