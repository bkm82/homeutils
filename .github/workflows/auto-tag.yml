name: Auto Tag

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  tag:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        uses: mathieudutour/github-tag-action@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
